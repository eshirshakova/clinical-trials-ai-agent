[project]
name = "ct-intel"
version = "0.1.0"
description = "Local-first ClinicalTrials.gov medallion pipeline with a read-only Gemini SQL agent."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "duckdb>=1.1",
  "boto3>=1.35",
  "langchain-core>=0.3",
  "langchain-google-genai>=2.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ct-intel = "ct_intel.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
